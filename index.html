 "No necesitas hacer nada extraordinario para ser especial; basta con ser tú. Tu manera de estar, escuchar y reír hace que el mundo se sienta un poquito más amable, gracias por siempre estar y brindarme felicidad."
];
const scene=document.querySelector("#scene");
const jarButton=document.querySelector("#jarButton");
const stars=[...document.querySelectorAll(".star")];
const modal=document.querySelector("#modal");
const messageText=document.querySelector("#messageText");
const modalTitle=document.querySelector("#modalTitle");
const progress=document.querySelector("#progress");
const sky=document.querySelector("#sky");
const skyBack=document.querySelector("#skyBack");
const seen=new Set();
const starNames=["Sidera tibi favent","Mein Polarstern","Wie ein wolkenloser Himmel","Lux semper","Von Herzen","Satis est quod es"];

jarButton.addEventListener("click",()=>{scene.classList.add("opened");jarButton.setAttribute("aria-label","Frasco abierto")});
stars.forEach((star,index)=>star.addEventListener("click",()=>{
 messageText.textContent=mensajes[index];
 modalTitle.textContent=starNames[index];
 modal.classList.add("show");
 star.classList.add("seen");
 seen.add(index);
 const left=6-seen.size;
 progress.textContent=left===0?":3":left+" "+(left===1?"mensaje espera":"mensajes esperan")+" ser descubiertos";
 if(seen.size===6)setTimeout(()=>{closeMessage();skyBack.classList.add("show");sky.classList.add("show");sky.setAttribute("aria-hidden","false")},550);
}));
function closeMessage(){modal.classList.remove("show")}
function hideSky(){sky.classList.remove("show");skyBack.classList.remove("show");sky.setAttribute("aria-hidden","true")}
function resetStars(){closeMessage();hideSky();seen.clear();stars.forEach(star=>star.classList.remove("seen"));scene.classList.remove("opened");progress.textContent="6 mensajes para ti :3";jarButton.setAttribute("aria-label","Abrir el frasco de estrellas")}
document.querySelector("#closeModal").addEventListener("click",closeMessage);
modal.addEventListener("click",event=>{if(event.target===modal)closeMessage()});
document.querySelector("#skyClose").addEventListener("click",hideSky);
document.querySelector("#resetButton").addEventListener("click",resetStars);
document.addEventListener("keydown",event=>{if(event.key==="Escape"){closeMessage();hideSky()}});
function makeSky(){
 skyBack.innerHTML="";
 const width=window.innerWidth,height=window.innerHeight;
 for(let i=0;i<120;i++){
  const dot=document.createElement("i");
  dot.className="sky-dot";dot.textContent=i%7===0?"★":"·";
  dot.style.left=Math.random()*100+"%";dot.style.top=Math.random()*100+"%";
  dot.style.fontSize=(9+Math.random()*23)+"px";dot.style.animationDuration=(1.4+Math.random()*3)+"s";
  skyBack.appendChild(dot);
 }
 const angle=36*Math.PI/180,length=Math.min(width*.52,height*.48);
 const dx=length*Math.cos(angle),dy=-length*Math.sin(angle);
 for(let i=0;i<5;i++){
  const comet=document.createElement("i");
  const startX=Math.random()*Math.max(1,width-dx),startY=height*(.48+Math.random()*.38);
  comet.className="shooting-star";comet.style.left=startX+"px";comet.style.top=startY+"px";
  comet.style.setProperty("--dx",dx+"px");comet.style.setProperty("--dy",dy+"px");
  comet.style.animationDuration=(5.5+Math.random()*2.8)+"s";comet.style.animationDelay=Math.random()*4.5+"s";
  skyBack.appendChild(comet);
 }
}
makeSky();
</script>
</body>
</html>
